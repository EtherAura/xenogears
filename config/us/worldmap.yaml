name: World map overlay (01/0F)
sha1: 5fee1deab3558c23bbe9c3a2eda3a2021a570911
# Provisional source files, named by start address until their contents are
# known. All code up to 0x8009980C was assembled by ASPSX >= 2.50 (`li` is
# addiu); the last two functions by ASPSX < 2.50 (ori), so they are a file of
# their own. Every divide keeps its checks; no $gp use. .rodata is jump
# tables and one 4-byte constant (in .rodata, not .sdata: -G0). A jump table
# sits 8-aligned from its object's .rodata start, so a change of address
# parity between tables starts a new file; where such a file starts in .text
# is the function boundary in its gap with the fewest crossing calls.
segments:
  - name: worldmap
    type: code
    start: 0x0
    vram: 0x8006FAF0
    subsegments:
      - [0x0, rodata]                     # 0x8006FAF0 a word (no code reference found)
