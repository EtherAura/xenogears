# Provisional source files, named by start address until their contents are
# known. Code before 0x800B1720 was assembled by ASPSX < 2.50 (`li` is ori),
# code from 0x800B1720 by ASPSX >= 2.50 (addiu), without exception; none of
# it uses $gp. .rodata is three strings and jump tables: a jump table sits
# 8-aligned from its object's .rodata start, so a change of address parity
# between tables, and strings after a table, start a new file. Where such a
# file starts in .text is not fixed by that: each start is the function
# boundary in the gap with the fewest calls crossing it. Region A is also cut
# where JP links blocks of it in another order (0x800728B8, 0x80083FF4,
# 0x80085350, 0x8008860C, 0x80089B50, 0x8008A274, 0x8008AC88, 0x8009EBA8).
