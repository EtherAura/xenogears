name: Battling overlay (01/0D)
sha1: 9cfebaf201a0dfd352c11007a63ad7a955533b17
# Provisional source files, named by start address until their contents are
# known. All compiled code was assembled by ASPSX < 2.50 (`li` is ori) with
# no divide checks and no $gp; func_8008C3A8 is handwritten GTE assembly
# (the only divides with checks). .rodata is a word, jump tables, constants
# and strings: a jump table sits 8-aligned from its object's .rodata start,
# so the tables fall into four objects by address parity. Where each starts
# in .text is the function boundary in its gap with the fewest calls
# crossing it; the call graph is too dense to show further files. JP builds
# from the same files (449 of 456 functions identical after masking).
segments:
  - name: battling
    type: code
    start: 0x0
    vram: 0x8006FAF0
    subsegments:
      - [0x0, rodata]                     # 0x8006FAF0 a word (no code reference found)
      - [0x4, .rodata, bl_800707A8]       # 0x8006FAF4 jump tables (parity 4)
      - [0xD8, .rodata, bl_800725B0]      # 0x8006FBC8 the viewer's strings (parity 0)
      - [0x108, .rodata, bl_800732CC]     # 0x8006FBF8 jump tables (parity 0)
      - [0x140, .rodata, bl_80075060]     # 0x8006FC30 strings shared by func_800751C8-func_8007AE10
      - [0x2F5, linkfill]                 # 0x8006FDE5 linker fill after "COM2 VICTORY"
      - [0x2F8, .rodata, bl_8007B270]     # 0x8006FDE8 func_8007D190's jump table
      - [0x32C, .rodata, bl_8007E528]     # 0x8006FE1C jump tables (parity 4), menu strings
      - [0x6D0, .rodata, bl_80083DCC]     # 0x800701C0 jump tables (parity 0), gear names
      - [0xBF5, linkfill]                 # 0x800706E5 linker fill after "RATE   : %3dfps\n"
      - [0xBF8, .rodata, bl_800891C0]     # 0x800706E8 jump tables
      - [0xC28, .rodata, bl_8008C7C0]     # 0x80070718 jump tables
