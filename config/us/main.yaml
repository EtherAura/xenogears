      - [0x9CE4, .rodata, psyq/libspu/s_sca] # 0x800194E4
      - [0x9D24, asm]            # 0x80019524: entry point (hand-written startup)
      # Provisional source files, bounded by compiler/assembler changes found
      # while matching (see config/build.yaml); true boundaries may differ.
      - [0x9D78, c, kernel]      # 0x80019578 main(), boot, kernel menu, party file loading
      - [0xBEC4, c, battle_boot] # 0x8001B6C4 battle entry, battle graphics init
      - [0xC170, c, game_init]   # 0x8001B970 game state, battle loader, debug menu
      - [0xCF6C, asm]            # 0x8001C76C 0x170-byte table inside .text
      - [0xD0DC, c, task]        # 0x8001C8DC task lists
      - [0xDA98, c, sprite]      # 0x8001D298 sprite actors (Noah: fieldGraphicObject)
      # The assembler 8-aligns jump tables relative to each object's .rodata,
      # and -mgpopt puts initializer constants ahead of them; retail's layout
      # of 0x800183D8-0x800188CC fits only with file breaks here and below.
      - [0x122D8, c, sprite_actor]    # 0x80021AD8 vector/animation-stack helpers, sprite actor state
      - [0x150D4, c, sprite_bytecode] # 0x800248D4 executeSpriteBytecode2
      - [0x15720, c, shape_transfer]  # 0x80024F20 VRAM shape-transfer queue, draw callbacks
