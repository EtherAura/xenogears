      - [0x23754, c, dialog]     # 0x80032F54 dialog text windows, font, text printer
      - [0x25E9C, c, pad]        # 0x8003569C controller input, replay, vibration, PC screen dumps (-G0)
      - [0x26EE0, c, printf]     # 0x800366E0 print hook and vprintf core
      - [0x274D8, c, debug_font] # 0x80036CD8 on-screen debug text (Noah debugFont), GCC 2.7.2 (PSY-Q)
      - [0x281B4, asm]           # 0x800379B4 hand-written (la with an empty delay slot, tail call)
      - [0x281D8, c, battle_env] # 0x800379D8 loadBattleMechaAndEnvironment (GCC 2.6.0)
      # The sound driver (GCC 2.6.0, -G8): two files, see sound.c's header.
      - [0x28388, c, sound]      # 0x80037B88 init, WDS/sequence lists, reverb, sound arena, SPU RAM blocks, instances
