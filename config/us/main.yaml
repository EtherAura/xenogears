      - [0x20F50, asm]           # 0x80030750 hand-written (self-patched render code and its patcher)
      - [0x21230, c, light]      # 0x80030A30 light matrices, back colour, triangle/box clipping
      - [0x21DA0, asm]           # 0x800315A0 hand-written: 21 add-to-OT stubs
      - [0x22094, c, heap]       # 0x80031894 heap / memory manager (allocateHeap, freeHeap, MCB dump)
      # heap_debug.c reaches D_800592B8 via %hi/%lo; heap.c defines it ($gp).
      - [0x235CC, c, heap_debug] # 0x80032DCC heap dump to a PC file
