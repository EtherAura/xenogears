      - [0x1CBE8, c, model]      # 0x8002C3E8 3D models: relocation, prim setup (Noah: 3dModel)
      - [0x1E810, asm]           # 0x8002E010 hand-written GTE render loops (Noah genericTrianglePrim_*, prim*_*)
