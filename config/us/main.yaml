name: Main executable (SLUS_006.64)
sha1: 560bbdbeb9264c935294ecad5a3d4ab230a006a9
# The PS-X EXE loads 0x49800 bytes at 0x80010000. Entry (0x80019524) sets
# $gp = 0x80059170 and clears BSS from 0x800592BC to 0x8006FAF0. The file's
# last 0x544 bytes are zero sector padding over the start of BSS; the build
# restores them (tools/pad_image.py pads to the retail file size).
segments:
  - [0x0, header, header]
  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x16834
    subsegments:
      # Read-only data, in the same file order as the code.
      - [0x800, rodata, boot_header]  # 0x80010000 runningOnDTL, file/dir tables, boot mode table (not kernel.c's: non-const)
      - [0x88FC, .rodata, kernel]     # 0x800180FC
      - [0x8B3C, .rodata, game_init]    # 0x8001833C
      - [0x8BD8, .rodata, sprite]       # 0x800183D8
      - [0x8E44, .rodata, sprite_actor] # 0x80018644
      - [0x8EE0, .rodata, sprite_bytecode]  # 0x800186E0
      - [0x90CC, .rodata, font]         # 0x800188CC
      - [0x90EC, .rodata, filesystem]   # 0x800188EC
      - [0x9180, .rodata, model]        # 0x80018980
      - [0x9198, .rodata, heap]         # 0x80018998 strings of heap.c's name tables
      - [0x927C, .rodata, dialog]       # 0x80018A7C
      - [0x92BC, .rodata, pad]          # 0x80018ABC
      - [0x9330, .rodata, printf]       # 0x80018B30 new 8-aligned object: vprintf's strings and jump table
      - [0x93DC, .rodata, sequencer]    # 0x80018BDC new object: the SPU transfer queue's jump table only
      - [0x93F0, .rodata, psyq/libc/sprintf] # 0x80018BF0
      - [0x94CC, .rodata, psyq/libcd/event] # 0x80018CCC
      - [0x94E4, .rodata, psyq/libcd/sys] # 0x80018CE4
      - [0x94EC, .rodata, psyq/libcd/bios] # 0x80018CEC
      - [0x973C, .rodata, psyq/libc2/puts] # 0x80018F3C
      - [0x9744, .rodata, psyq/libcd/cdread] # 0x80018F44
      - [0x9788, .rodata, psyq/libgpu/prim] # 0x80018F88
      - [0x9858, .rodata, psyq/libgpu/sys] # 0x80019058 "$Id: sys.c ..." first
      - [0x9A8C, .rodata, psyq/libgpu/tmd]  # 0x8001928C
      - [0x9BC4, .rodata, psyq/libetc/vsync] # 0x800193C4
      - [0x9BD4, .rodata, psyq/libetc/intr] # 0x800193D4 "$Id: intr.c ..." first
      - [0x9C40, .rodata, psyq/libetc/intr_dma] # 0x80019440
      - [0x9C6C, .rodata, psyq/libspu/spu] # 0x8001946C
