  - {name: menu,           dir: 0x01, file: 0x11, lzss: true, vram: 0x801C5000, sha1: fd911d26b921d6eb0c73c3bbc83ea82dc459122f, copies: ["10/05", "10/07", "10/0B", "24/25"]}
