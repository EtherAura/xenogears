# Xenogears (USA), SLUS-00664: every unique code-bearing file on Disc 1.
# Disc 2 carries byte-identical copies of all overlays; its boot executable
# (SLUS_006.69) differs only in an embedded copy of the file table.
#
# Source is either `iso: NAME` (ISO9660 root) or `dir`/`file` in the game's
# own file table (see tools/xenofs.py). `lzss: true` files are stored
# compressed; the extracted file is the decompressed image the game loads.
# `vram` is the load address, documented here for reference; the splat
# configs are authoritative. Where the same image is stored more than once,
# `copies` lists the other locations.

image: bin/Xenogears (USA) (Disc 1)/Xenogears (USA) (Disc 1).bin
image_sha256: 39c547a9afc6da15d847ef81a2c6cea1a6516bdfa562cf13b0999b04e8598bda

files:
  # Boot executable: kernel, PSY-Q libraries, shared engine code.
  - {name: main, iso: SLUS_006.64, vram: 0x80010000, sha1: 560bbdbeb9264c935294ecad5a3d4ab230a006a9}

  # Game-mode overlays, loaded at the end of the executable's BSS.
  - {name: battling, dir: 0x01, file: 0x0D, lzss: true, vram: 0x8006FAF0, sha1: 9cfebaf201a0dfd352c11007a63ad7a955533b17}
