name: Main executable (SLPS_011.60)
sha1: 3f9633f80213427f55894cda9fc8c3346ecf31b4
# The PS-X EXE loads 0x49000 bytes at 0x80010000. Entry (0x800195B8) sets
# $gp = 0x80058810 and clears BSS from 0x80058958 to 0x8006F180. The file's
# last bytes are zero sector padding over the start of BSS; the build
# restores them (tools/pad_image.py pads to the retail file size).
segments:
  - [0x0, header, header]
  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x16828
