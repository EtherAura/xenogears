<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">From your discs to a matching build</title><desc id="desc">Extract code from your US or Japanese discs, rebuild C and assembly with the original toolchain, then compare every module against retail.</desc>
<rect width="1120" height="350" rx="22" fill="#111923"/>
<g font-family="sans-serif"><text x="52" y="58" fill="#e5eaf1" font-size="27" font-weight="700">XENOGEARS / MATCHING DECOMPILATION</text><text x="52" y="90" fill="#9caec2" font-size="16">US + JP · shared C source · retail byte comparisons</text>
<g fill="#1c2a3b" stroke="#405770"><rect x="50" y="128" width="222" height="142" rx="14"/><rect x="316" y="128" width="222" height="142" rx="14"/><rect x="582" y="128" width="222" height="142" rx="14"/><rect x="848" y="128" width="222" height="142" rx="14"/></g>
<g fill="#83cfcc" font-size="22" font-weight="700"><text x="75" y="174">01 / Your discs</text><text x="341" y="174">02 / Extract</text><text x="607" y="174">03 / Rebuild</text><text x="873" y="174">04 / Compare</text></g>
<g fill="#c3cfde" font-size="16"><text x="75" y="212">US or Japanese release</text><text x="75" y="239">No game data included</text><text x="341" y="212">Code from your image</text><text x="341" y="239">Checked against retail</text><text x="607" y="212">C + original toolchain</text><text x="607" y="239">PlayStation modules</text><text x="873" y="212">Byte-for-byte checks</text><text x="873" y="239">Matching stays local</text></g>
<g fill="#83cfcc" font-size="26"><text x="282" y="207">→</text><text x="548" y="207">→</text><text x="814" y="207">→</text></g><text x="52" y="316" fill="#9caec2" font-size="15">GitHub CI checks tools and configuration without a disc; it does not certify a retail match.</text></g></svg>
